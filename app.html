<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1F4E79">
<title>Almacén Mediese - App</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body class="app-body">

<header class="app-header">
  <div class="header-left">
    <span class="header-logo">📦</span>
    <span class="header-title">Almacén Mediese</span>
  </div>
  <div class="header-right">
    <span id="user-info" class="user-info"></span>
    <button id="btn-logout" class="btn-logout">Salir</button>
  </div>
</header>

<main class="app-main">

  <!-- Vista: MENÚ PRINCIPAL -->
  <section id="view-menu" class="view-section hidden">
    <div class="menu-container">
      <h2 class="menu-titulo">¿Qué deseas registrar?</h2>
      <p class="menu-descripcion">Selecciona el tipo de movimiento</p>

      <div class="menu-botones">
        <button id="btn-entrada" class="menu-btn menu-btn-entrada">
          <span class="menu-btn-icono">📥</span>
          <span class="menu-btn-texto">ENTRADA</span>
          <span class="menu-btn-desc">Recibo de material</span>
        </button>

        <button id="btn-salida" class="menu-btn menu-btn-salida">
          <span class="menu-btn-icono">📤</span>
          <span class="menu-btn-texto">SALIDA</span>
          <span class="menu-btn-desc">Consumo a producción</span>
        </button>

        <button id="btn-devolucion" class="menu-btn menu-btn-devolucion">
          <span class="menu-btn-icono">🔄</span>
          <span class="menu-btn-texto">DEVOLUCIÓN</span>
          <span class="menu-btn-desc">Retorno de sobrantes</span>
        </button>
      </div>

      <button id="btn-ver-historial" class="btn-secondary">📊 Ver mis movimientos de hoy</button>
    </div>
  </section>

  <!-- Vista: FORMULARIO DE MOVIMIENTO -->
  <section id="view-form" class="view-section hidden">
    <div class="form-container">
      <div class="form-header">
        <button id="btn-cerrar-form" class="btn-cerrar">✖</button>
        <h2 id="form-titulo">Registrar Movimiento</h2>
      </div>

      <!-- Paso 1: Buscar insumo -->
      <div class="input-group">
        <label for="buscar-insumo">Buscar insumo</label>
        <input type="text" id="buscar-insumo" placeholder="Escribe código o nombre (ej: HARINA, MPH0009)">
        <div id="resultados-busqueda" class="resultados-busqueda hidden"></div>
      </div>

      <!-- Info del insumo seleccionado -->
      <div id="info-insumo" class="info-insumo hidden">
        <div class="info-row">
          <span class="info-label">Código:</span>
          <span id="info-codigo" class="info-value">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Descripción:</span>
          <span id="info-descripcion" class="info-value">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Unidad:</span>
          <span id="info-unidad" class="info-value">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Categoría:</span>
          <span id="info-categoria" class="info-value">-</span>
        </div>
      </div>

      <!-- Lote del insumo -->
      <div class="input-group">
        <label for="lote-insumo">Lote del insumo <span class="label-opcional">(opcional en ENTRADA)</span></label>
        <input type="text" id="lote-insumo" placeholder="Ej: LMKSI-4">
      </div>

      <!-- Lote de trabajo (solo para SALIDA y DEVOLUCION) -->
      <div class="input-group" id="grupo-lote-trabajo">
        <label for="lote-trabajo">Lote de trabajo</label>
        <input type="text" id="lote-trabajo" placeholder="Ej: LR7RA-1">
      </div>

      <!-- Cantidad -->
      <div class="input-group">
        <label for="cantidad">Cantidad <span id="label-unidad">(KG)</span></label>
        <input type="number" id="cantidad" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
      </div>

      <!-- Ubicación / DC (para salidas de PT) -->
      <div class="input-group" id="grupo-ubicacion">
        <label for="ubicacion">Ubicación / DC destino</label>
        <select id="ubicacion" class="manual-select">
          <option value="">-- Selecciona --</option>
        </select>
      </div>

      <!-- Proveedor / Cliente (solo para ENTRADA y SALIDA) -->
      <div class="input-group" id="grupo-proveedor">
        <label for="proveedor">Proveedor / Cliente</label>
        <input type="text" id="proveedor" placeholder="Ej: TRES VILLAS / PRODUCCION">
      </div>

      <!-- PU e IVA (opcional) -->
      <div class="input-group-row">
        <div class="input-group">
          <label for="pu">PU ($)</label>
          <input type="number" id="pu" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
        </div>
        <div class="input-group">
          <label for="iva">IVA ($)</label>
          <input type="number" id="iva" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
        </div>
      </div>

      <!-- Notas -->
      <div class="input-group">
        <label for="notas">Notas (opcional)</label>
        <input type="text" id="notas" placeholder="Ej: Compra OC-1234">
      </div>

      <!-- Estado de registro -->
      <p id="registro-status" class="send-status"></p>

      <!-- Botones de acción -->
      <button id="btn-guardar" class="btn-primary btn-large">
        ✅ Guardar Movimiento
      </button>
      <button id="btn-cancelar-form" class="btn-secondary">
        Cancelar
      </button>
    </div>
  </section>

  <!-- Vista: CONFIRMACIÓN -->
  <section id="view-exito" class="view-section hidden">
    <div class="exito-container">
      <div class="exito-icono">✅</div>
      <h2 class="exito-titulo">¡Movimiento Registrado!</h2>
      <p id="exito-subtitulo" class="exito-subtitulo">Se guardó correctamente</p>

      <div class="exito-detalle">
        <div class="exito-fila">
          <span>ID:</span>
          <strong id="exito-id">-</strong>
        </div>
        <div class="exito-fila">
          <span>Tipo:</span>
          <strong id="exito-tipo">-</strong>
        </div>
        <div class="exito-fila">
          <span>Insumo:</span>
          <strong id="exito-insumo">-</strong>
        </div>
        <div class="exito-fila">
          <span>Cantidad:</span>
          <strong id="exito-cantidad">-</strong>
        </div>
        <div class="exito-fila">
          <span>Fecha/Hora:</span>
          <strong id="exito-fecha">-</strong>
        </div>
      </div>

      <button id="btn-registrar-otro" class="btn-primary btn-large">🔄 Registrar otro</button>
      <button id="btn-volver-menu" class="btn-secondary">Volver al menú</button>
    </div>
  </section>

  <!-- Vista: HISTORIAL -->
  <section id="view-historial" class="view-section hidden">
    <div class="historial-container">
      <div class="form-header">
        <button id="btn-cerrar-historial" class="btn-cerrar">✖</button>
        <h2>📊 Mis Movimientos de Hoy</h2>
      </div>
      <div id="lista-movimientos" class="lista-movimientos"></div>
    </div>
  </section>

  <!-- Vista: LOADING -->
  <section id="view-loading" class="view-section hidden">
    <div class="loading-container">
      <div class="spinner"></div>
      <p id="loading-text">Cargando...</p>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<script src="app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    App.initApp();
  });
</script>
</body>
</html>
